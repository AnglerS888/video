# ============================================================
# 影视库（videodl）极简 docker-compose
# 构建: docker compose build   启动: docker compose up -d
# ============================================================
services:
  videodl:
    build: .
    image: videodl:latest
    container_name: videodl
    restart: unless-stopped
    # 宿主端口可改：VDL_PORT=8080 docker compose up -d
    ports:
      - "${VDL_PORT:-5200}:5200"
    volumes:
      # 数据库、ffmpeg、封面与下载的视频都在该目录
      - ./videodata:/app/videodata
    environment:
      - TZ=Asia/Shanghai
      # 配置在数据目录的 config.yml（首次启动自动生成，改完重启容器）；
      # 页面可改项在同目录 ui.yml（保存即生效）
      - VDL_CONFIG=/app/videodata/config.yml
      # 容器内「立即更新」自编译用的 Go 代理（国内链路）
      - GOPROXY=${VDL_GOPROXY:-https://goproxy.cn|https://goproxy.io|direct}
    # PID 1 有 init 收尸转发信号，docker stop 的 SIGTERM 才能送达程序
    init: true
    # 给正在跑的 ffmpeg 合并/下载留出收尾时间
    stop_grace_period: 30s
    healthcheck:
      # 轻量探活；端口写死容器内 5200（改 config.yml 的 server.addr 需同步改）
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5200/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 日志限流，防止长期运行吃满系统盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
